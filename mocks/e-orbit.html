<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lume · Orbit</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Recursive:wght,CASL,MONO@400,0.5,1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-deep:#1a1410;--bg-surface:#231e18;--bg-elevated:#2e2720;--text-primary:#f5f0e8;--text-secondary:#c4b8a8;--text-muted:#9a8e80;--accent-rose:#c4867a;--accent-gold:#c4a24e;--border:#3a322a}
html,body{height:100%;overflow:hidden;background:var(--bg-deep);color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif}
h1,h2,h3{font-family:'Cabinet Grotesk',sans-serif}
code,.mono{font-family:'Recursive',monospace}

.orbit-container{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* Presence blob */
.presence{position:relative;width:280px;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.blob{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--accent-rose),var(--bg-elevated));opacity:.35;filter:blur(40px);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.presence-text{position:relative;z-index:1;text-align:center}
.presence-text h2{font-size:1.1rem;color:var(--text-primary);margin-bottom:4px}
.presence-text .status{font-size:.85rem;color:var(--accent-rose)}
.presence-text .agents-count{font-size:.75rem;color:var(--text-muted);margin-top:6px}

/* Agent pills */
.agent-pills{display:flex;gap:8px;margin-top:16px;position:relative;z-index:3}
.agent-pill{padding:4px 12px;border-radius:20px;background:var(--bg-surface);border:1px solid var(--border);font-size:.7rem;color:var(--text-secondary);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.agent-pill:hover{border-color:var(--accent-rose);color:var(--text-primary)}
.agent-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-gold);animation:pulse 2s infinite}
.agent-pill.done .dot{background:var(--accent-rose);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Thread cards */
.thread-card{position:absolute;width:200px;padding:14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .4s ease;z-index:2}
.thread-card:hover{border-color:var(--accent-gold);transform:scale(1.04)!important}
.thread-card h3{font-size:.85rem;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.thread-card .preview{font-size:.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-rose);display:inline-block;flex-shrink:0}

/* Thread overlay */
.thread-overlay{position:fixed;bottom:0;left:0;right:0;height:0;background:var(--bg-surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;z-index:10;transition:height .4s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column}
.thread-overlay.open{height:70vh}
.thread-overlay .thread-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.thread-overlay .thread-header h3{font-size:1rem}
.thread-overlay .close-btn{background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer}
.thread-messages{flex:1;overflow-y:auto;padding:16px 20px}
.msg{margin-bottom:14px}
.msg .speaker{font-size:.8rem;font-weight:600;margin-bottom:2px}
.msg .speaker.mikki{color:var(--accent-rose)}
.msg .speaker.you{color:var(--accent-gold)}
.msg .text{font-size:.9rem;color:var(--text-secondary);line-height:1.5}
.input-area{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px}
.input-area textarea{flex:1;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text-primary);font-family:inherit;font-size:.85rem;resize:none;outline:none;height:42px}
.input-area textarea:focus{border-color:var(--accent-gold)}

/* Quick input */
.quick-input{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:400px;z-index:5}
.quick-input textarea{width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text-primary);font-family:inherit;font-size:.85rem;resize:none;outline:none;height:44px}
.quick-input textarea:focus{border-color:var(--accent-gold)}

/* Agent trajectory overlay */
.trajectory-overlay{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:var(--bg-surface);border-left:1px solid var(--border);z-index:20;transition:right .3s ease;display:flex;flex-direction:column}
.trajectory-overlay.open{right:0}
.trajectory-overlay .traj-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.trajectory-overlay .traj-header h3{font-size:.95rem}
.trajectory-overlay .traj-content{flex:1;overflow-y:auto;padding:16px;font-family:'Recursive',monospace;font-size:.78rem;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap}

/* Notification */
.notification{position:fixed;top:20px;right:20px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:.8rem;color:var(--text-primary);z-index:30;transform:translateX(120%);transition:transform .3s ease;cursor:pointer}
.notification.show{transform:translateX(0)}
.notification .notif-agent{color:var(--accent-rose);font-weight:600}
</style>
</head><body>
<div class="orbit-container">
  <div class="presence">
    <div class="blob"></div>
    <div class="presence-text">
      <h2>Mikki</h2>
      <div class="status" id="presenceStatus">Active</div>
      <div class="agents-count" id="agentCount">2 agents working</div>
    </div>
    <div class="agent-pills" id="agentPills">
      <div class="agent-pill" onclick="showTrajectory('forge')"><span class="dot"></span>Forge · 3m</div>
      <div class="agent-pill" onclick="showTrajectory('bastion')"><span class="dot"></span>Bastion · 1m</div>
    </div>
  </div>

  <div class="thread-card" id="threadMain" style="top:18%;left:55%" onclick="openThread('main')">
    <h3>Main</h3>
    <div class="preview" id="mainPreview">PIN auth shipped. PRs merged and deployed. ✅</div>
  </div>
  <div class="thread-card" id="threadRoom" style="top:60%;left:18%" onclick="openThread('room')">
    <h3>Room Redesign <span class="unread-dot" id="roomUnread"></span></h3>
    <div class="preview">Alma rated the prototype 4/5. 24 fixes queued.</div>
  </div>
</div>

<div class="quick-input" id="quickInput">
  <textarea placeholder="Message Mikki..." id="quickText" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendQuick()}"></textarea>
</div>

<div class="thread-overlay" id="threadOverlay">
  <div class="thread-header"><h3 id="overlayTitle">Main</h3><button class="close-btn" onclick="closeThread()">✕</button></div>
  <div class="thread-messages" id="threadMessages"></div>
  <div class="input-area"><textarea id="threadInput" placeholder="Reply..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendInThread()}"></textarea></div>
</div>

<div class="trajectory-overlay" id="trajOverlay">
  <div class="traj-header"><h3 id="trajTitle">Agent</h3><button class="close-btn" onclick="closeTraj()">✕</button></div>
  <div class="traj-content" id="trajContent"></div>
</div>

<div class="notification" id="notification" onclick="handleNotifClick()">
  <span class="notif-agent" id="notifAgent"></span> <span id="notifText"></span>
</div>

<script>
const threads={
  main:[{s:'mikki',t:'PIN auth shipped. PRs merged and deployed. ✅'}],
  room:[
    {s:'mikki',t:'I\'ve been working on the room redesign with Alma.'},
    {s:'mikki',t:'Alma rated the prototype 4/5. 24 fixes queued.'},
    {s:'you',t:'Nice. What are the top fixes?'},
    {s:'mikki',t:'Mostly spacing issues, color contrast on mobile, and the nav animation feels sluggish. Alma flagged the font loading as the biggest perf hit.'}
  ]
};
let currentThread=null;
let demoPhase=0;
const trajectories={
  forge:{title:'Forge — fixing playground',lines:['$ checking out branch fix/playground-layout','Analyzing component tree...','Found 3 layout issues in PlaygroundContainer','Fixing flex-wrap on card grid...','Updating responsive breakpoints...','Running tests... 14/14 passed','Building... done in 2.3s','Changes committed: fix(playground): correct grid layout and breakpoints']},
  bastion:{title:'Bastion — daily audit',lines:['Starting daily audit...','Checking dependency versions... ok','Scanning for unused exports... 2 found','Checking bundle size... 142kb (limit: 200kb) ✓','Reviewing error rates... 0.02% (nominal)','Checking SSL certs... valid, 48 days remaining','Audit complete. 1 finding: 2 unused exports in utils/legacy.ts']},
  forge2:{title:'Forge — image upload PR',lines:['$ checking out branch fix/image-upload','Reading PR diff... 14 files changed','Analyzing upload handler...','Found race condition in multipart parsing','Fixing async/await chain...','Adding size validation before upload...','Running tests...',' test/upload.spec.ts ... 8/8 passed','Building... done in 1.8s','Changes committed: fix(upload): resolve race condition in multipart handler']}
};

function openThread(name){
  currentThread=name;
  document.getElementById('quickInput').style.display='none';
  document.getElementById('overlayTitle').textContent=name==='main'?'Main':'Room Redesign';
  renderMessages(name);
  document.getElementById('threadOverlay').classList.add('open');
  if(name==='room')document.getElementById('roomUnread').style.display='none';
}
function closeThread(){
  document.getElementById('threadOverlay').classList.remove('open');
  document.getElementById('quickInput').style.display='';
  currentThread=null;
}
function renderMessages(name){
  const el=document.getElementById('threadMessages');
  el.innerHTML=threads[name].map(m=>`<div class="msg"><div class="speaker ${m.s}">${m.s==='mikki'?'Mikki':'You'}</div><div class="text">${m.t}</div></div>`).join('');
  el.scrollTop=el.scrollHeight;
}
function addMsg(thread,speaker,text){
  threads[thread].push({s:speaker,t:text});
  if(currentThread===thread)renderMessages(thread);
}
function streamMsg(thread,speaker,text,cb){
  threads[thread].push({s:speaker,t:''});
  const idx=threads[thread].length-1;
  let i=0;
  const iv=setInterval(()=>{
    if(i<text.length){threads[thread][idx].t+=text[i];i++;if(currentThread===thread)renderMessages(thread);}
    else{clearInterval(iv);if(cb)cb();}
  },30);
}
function sendInThread(){
  const inp=document.getElementById('threadInput');
  const t=inp.value.trim();if(!t)return;
  inp.value='';
  addMsg(currentThread,'you',t);
  if(demoPhase===0){demoPhase=1;runStep5();}
  else if(demoPhase===2){demoPhase=3;runStep9();}
}
function sendQuick(){
  const inp=document.getElementById('quickText');
  const t=inp.value.trim();if(!t)return;
  inp.value='';
  openThread('main');
  addMsg('main','you',t);
  if(demoPhase===0){demoPhase=1;runStep5();}
}

function showTrajectory(name){
  const t=trajectories[name];if(!t)return;
  document.getElementById('trajTitle').textContent=t.title;
  document.getElementById('trajContent').textContent=t.lines.join('\n');
  document.getElementById('trajOverlay').classList.add('open');
}
function closeTraj(){document.getElementById('trajOverlay').classList.remove('open')}

function showNotif(agent,text,trajName){
  const n=document.getElementById('notification');
  document.getElementById('notifAgent').textContent=agent+':';
  document.getElementById('notifText').textContent=text;
  n.dataset.traj=trajName||'';
  n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'),5000);
}
function handleNotifClick(){
  const n=document.getElementById('notification');
  n.classList.remove('show');
  if(n.dataset.traj)showTrajectory(n.dataset.traj);
}

// Demo
function runStep5(){
  const resp="Let me check what's queued up. Top priorities right now:\n\n1. Image upload PR — has a race condition flagged in review\n2. Room redesign fixes — Alma queued 24 items\n3. Playground layout is almost done (Forge is on it)\n\nI'd suggest the image upload PR next since it's blocking the release.";
  streamMsg('main','mikki',resp,()=>{demoPhase=2;});
  // Bastion completes mid-stream
  setTimeout(()=>{
    updatePill('bastion','done');
    showNotif('Bastion','daily audit done. 1 finding.','bastion');
    document.getElementById('agentCount').textContent='1 agent working';
  },3000);
}
function runStep9(){
  streamMsg('main','mikki','On it. Spawning Forge...',()=>{
    // New forge trajectory
    const pills=document.getElementById('agentPills');
    const p=document.createElement('div');
    p.className='agent-pill';p.innerHTML='<span class="dot"></span>Forge · 0s';
    p.onclick=()=>showTrajectory('forge2');
    pills.appendChild(p);
    document.getElementById('agentCount').textContent='2 agents working';
    // Simulate progress
    let s=0;
    const iv=setInterval(()=>{
      s++;p.innerHTML=`<span class="dot"></span>Forge · ${s}s`;
      if(s>=8){
        clearInterval(iv);
        p.classList.add('done');p.innerHTML='<span class="dot"></span>Forge ✓';
        document.getElementById('agentCount').textContent='1 agent working';
        showNotif('Forge','image upload PR fixed.','forge2');
      }
    },1000);
  });
}
function updatePill(name,state){
  const pills=document.querySelectorAll('.agent-pill');
  pills.forEach(p=>{if(p.textContent.toLowerCase().includes(name)&&state==='done'){p.classList.add('done');p.innerHTML=`<span class="dot"></span>${name.charAt(0).toUpperCase()+name.slice(1)} ✓`;}});
}

// Auto-start demo
setTimeout(()=>{
  openThread('main');
  setTimeout(()=>{
    document.getElementById('threadInput').value='what should we tackle next?';
    setTimeout(()=>sendInThread(),600);
  },1000);
},2000);
</script>
</body></html>
