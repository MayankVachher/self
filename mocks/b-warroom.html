<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lume — War Room</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Recursive:wght,CASL,MONO@400,0.5,1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-deep:#1a1410;--bg-surface:#231e18;--bg-elevated:#2e2720;--text-primary:#f5f0e8;--text-secondary:#c4b8a8;--text-muted:#9a8e80;--accent-rose:#c4867a;--accent-gold:#c4a24e;--border:#3a322a}
html,body{height:100%;background:var(--bg-deep);color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,134,122,.3)}50%{box-shadow:0 0 12px 4px rgba(196,134,122,.15)}}
#header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg-surface)}
#header h1{font-family:'Cabinet Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--accent-rose)}
#header .agents{color:var(--text-muted);font-size:13px}
#header .time{color:var(--text-muted);font-size:13px;font-family:'Recursive',monospace}
#grid{display:grid;grid-template-columns:65% 35%;height:calc(100vh - 49px)}
#board{padding:16px 20px;overflow-y:auto;border-right:1px solid var(--border)}
.status-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.scard{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;flex:1;min-width:160px}
.scard .sc-title{font-family:'Cabinet Grotesk',sans-serif;font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.scard .sc-body{font-size:12px;color:var(--text-muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.green{background:#6bc46b}.dot.amber{background:var(--accent-gold)}.dot.blue{background:#5b9bd5}.dot.rose{background:var(--accent-rose)}
h2.section{font-family:'Cabinet Grotesk',sans-serif;font-size:14px;color:var(--text-muted);margin:16px 0 10px;font-weight:500}
.agent-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;animation:fadeUp .3s ease}
.agent-card.active{animation:pulse 2s infinite}
.agent-card .ac-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agent-card .ac-icon{width:28px;height:28px;border-radius:8px;background:var(--accent-rose);display:flex;align-items:center;justify-content:center;font-size:13px}
.agent-card .ac-name{font-family:'Cabinet Grotesk',sans-serif;font-weight:600;font-size:14px;flex:1}
.agent-card .ac-time{font-size:11px;color:var(--text-muted);font-family:'Recursive',monospace}
.agent-card .ac-task{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.agent-card .ac-output{font-family:'Recursive',monospace;font-size:11px;color:var(--text-muted);line-height:1.7}
.agent-card .ac-output div{animation:fadeUp .2s ease}
.agent-card.done .ac-icon{background:#6bc46b}
.agent-card.done{animation:none;border-color:rgba(107,196,107,.2)}
.pbar{height:3px;background:var(--border);border-radius:2px;margin:8px 0;overflow:hidden}
.pbar-fill{height:100%;background:var(--accent-rose);border-radius:2px;transition:width .5s ease}
.agent-card.done .pbar-fill{background:#6bc46b}
.notif{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:12px;color:var(--text-secondary);animation:fadeUp .3s ease}
.notif .n-time{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:'Recursive',monospace}
#chat{display:flex;flex-direction:column;height:100%}
#chat-msgs{flex:1;overflow-y:auto;padding:12px 14px}
#chat-msgs::-webkit-scrollbar{width:4px}
#chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.cm{margin-bottom:10px;animation:fadeUp .2s ease}
.cm.user{text-align:right}
.cm.user .cb{display:inline-block;background:var(--bg-elevated);border:1px solid var(--border);padding:6px 12px;border-radius:10px 10px 2px 10px;font-size:13px;max-width:85%;text-align:left}
.cm.assistant .cn{color:var(--accent-rose);font-size:11px;font-weight:600;margin-bottom:2px}
.cm.assistant .ct{color:var(--text-secondary);font-size:13px;line-height:1.5}
#chat-input{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px}
#chat-input textarea{flex:1;background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;padding:8px 10px;resize:none;outline:none;min-height:36px;max-height:80px}
#chat-input button{background:var(--accent-rose);border:none;border-radius:8px;color:var(--bg-deep);font-weight:600;padding:8px 14px;cursor:pointer;font-size:13px}
</style></head><body>
<div id="header"><h1>Lume</h1><div class="agents" id="agent-count">0 agents active</div><div class="time" id="clock"></div></div>
<div id="grid">
<div id="board">
<div class="status-row" id="status-row"></div>
<h2 class="section">Live Agents</h2>
<div id="agents-area"><div style="color:var(--text-muted);font-size:13px">No active agents</div></div>
<h2 class="section">Notifications</h2>
<div id="notifs"></div>
</div>
<div id="chat">
<div id="chat-msgs"></div>
<div id="chat-input"><textarea id="inp" rows="1" placeholder="Message Mikki..."></textarea><button id="send">Send</button></div>
</div>
</div>
<script>
const chatMsgs=document.getElementById('chat-msgs'),inp=document.getElementById('inp'),statusRow=document.getElementById('status-row'),agentsArea=document.getElementById('agents-area'),notifsEl=document.getElementById('notifs'),agentCountEl=document.getElementById('agent-count'),clockEl=document.getElementById('clock');
let demoStep=0,demoLock=false,activeAgents=0;

setInterval(()=>{clockEl.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})},1000);clockEl.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

function scrollChat(){chatMsgs.scrollTop=chatMsgs.scrollHeight}
function setAgentCount(n){activeAgents=n;agentCountEl.textContent=n?n+' agent'+(n>1?'s':'')+' active':'All clear'}

function addChatUser(t){const d=document.createElement('div');d.className='cm user';d.innerHTML=`<div class="cb">${t}</div>`;chatMsgs.appendChild(d);scrollChat()}
function streamChat(text,cb){const d=document.createElement('div');d.className='cm assistant';d.innerHTML=`<div class="cn">Mikki</div><div class="ct"></div>`;chatMsgs.appendChild(d);const ct=d.querySelector('.ct');let i=0;const iv=setInterval(()=>{if(i<text.length){ct.textContent+=text[i];i++;scrollChat()}else{clearInterval(iv);cb&&cb()}},25);return d}

function setStatusCards(cards){statusRow.innerHTML='';cards.forEach(c=>{const d=document.createElement('div');d.className='scard';d.innerHTML=`<div class="sc-title"><span class="dot ${c.color}"></span>${c.title}</div><div class="sc-body">${c.body}</div>`;statusRow.appendChild(d)})}

function addNotif(text){const d=document.createElement('div');d.className='notif';d.innerHTML=`${text}<div class="n-time">${new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</div>`;notifsEl.prepend(d)}

function spawnForge(){
  agentsArea.innerHTML='';
  const d=document.createElement('div');d.className='agent-card active';d.id='forge-card';
  d.innerHTML=`<div class="ac-top"><div class="ac-icon">⚒</div><div class="ac-name">Forge</div><div class="ac-time" id="forge-time">0s</div></div><div class="ac-task">Fixing image upload PR</div><div class="pbar"><div class="pbar-fill" id="forge-bar" style="width:0%"></div></div><div class="ac-output" id="forge-log"></div>`;
  agentsArea.appendChild(d);setAgentCount(1);
  const log=document.getElementById('forge-log'),bar=document.getElementById('forge-bar'),timeEl=document.getElementById('forge-time');
  const steps=['Reading files...','Fixing send button gating...','Fixing TypeScript error...','Running type check...','Committing changes...'];
  let si=0,sec=0;
  const ti=setInterval(()=>{sec++;timeEl.textContent=sec+'s'},1000);
  const iv=setInterval(()=>{
    if(si<steps.length){const l=document.createElement('div');l.textContent='> '+steps[si];log.appendChild(l);bar.style.width=((si+1)/steps.length*100)+'%';si++}
    else{clearInterval(iv);clearInterval(ti);d.classList.remove('active');d.classList.add('done');
      const l=document.createElement('div');l.style.color='#6bc46b';l.textContent='✓ Done. Fixed send button gating and TS compilation error.';log.appendChild(l);
      setAgentCount(0);
      setStatusCards([{title:'PIN Auth',color:'green',body:'Shipped — PR #7 merged'},{title:'Image Upload',color:'green',body:'Fixed — ready for review'},{title:'Chaos Testing',color:'blue',body:'Running (Forge)'}]);
      setTimeout(()=>{addNotif('🛡 Bastion\'s daily audit complete. 1 finding: 17 pending system updates.');demoLock=false},2000);
    }
  },1500);
}

function handleSend(){
  const t=inp.value.trim();if(!t)return;inp.value='';
  addChatUser(t);
  if(demoStep===0&&/status|everything/i.test(t)){demoStep=1;demoLock=true;
    setTimeout(()=>streamChat('PIN auth shipped ✅. Room prototype waiting on Alma\'s fixes. Image upload PR pending — has a gating bug. Chaos testing running.',()=>{demoLock=false}),400);
  }else if(demoStep===1&&/fix.*image|image.*fix/i.test(t)){demoStep=2;demoLock=true;
    setTimeout(()=>streamChat('On it. Spawning Forge...',()=>{setTimeout(spawnForge,500)}),400);
  }else if(!demoLock){setTimeout(()=>streamChat('(Demo mode — try "what\'s the status on everything?" or "fix the image upload PR")'),300)}
}

document.getElementById('send').onclick=handleSend;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});

// Auto-play
setTimeout(()=>{
  setStatusCards([{title:'PIN Auth',color:'green',body:'Shipped — PR #7 merged'},{title:'Image Upload',color:'amber',body:'Review pending'},{title:'Chaos Testing',color:'blue',body:'Running (Forge)'}]);
  addNotif('Bastion\'s daily security audit passed ✓');
  addNotif('Forge finished PIN auth fixes (PR #7 merged)');
  addNotif('2 new emails arrived');
  setTimeout(()=>{
    addChatUser('what\'s the status on everything?');demoLock=true;
    setTimeout(()=>{demoStep=1;streamChat('PIN auth shipped ✅. Room prototype waiting on Alma\'s fixes. Image upload PR pending — has a gating bug. Chaos testing running.',()=>{demoLock=false;
      setTimeout(()=>{addChatUser('fix the image upload PR');demoStep=2;demoLock=true;
        setTimeout(()=>streamChat('On it. Spawning Forge...',()=>{setTimeout(spawnForge,500)}),400);
      },2000);
    })},600);
  },1500);
},2000);
</script></body></html>
