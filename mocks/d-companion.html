<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lume — Companion</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Recursive:wght,CASL,MONO@400,0.5,1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-deep:#1a1410;--bg-surface:#231e18;--bg-elevated:#2e2720;--text-primary:#f5f0e8;--text-secondary:#c4b8a8;--text-muted:#9a8e80;--accent-rose:#c4867a;--accent-gold:#c4a24e;--border:#3a322a}
html,body{height:100%;background:var(--bg-deep);color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;overflow:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blobFloat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
@keyframes blobActive{0%,100%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,-50%) scale(1.12)}50%{transform:translate(-50%,-50%) scale(0.95)}75%{transform:translate(-50%,-50%) scale(1.08)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(196,162,78,.4)}100%{box-shadow:0 0 0 30px rgba(196,162,78,0)}}
#app{height:100vh;display:flex;flex-direction:column;transition:all .5s ease}
#presence{flex:0 0 auto;height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:height .6s ease;position:relative;overflow:hidden}
#presence.compact{height:15vh;min-height:80px}
#presence.compact #blob-wrap{transform:scale(.4)}
#presence.compact #state-text{font-size:13px}
#presence.compact #quick-actions{display:none}
#blob-wrap{position:relative;width:160px;height:160px;transition:transform .5s ease}
#blob{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--accent-rose),#8b5a4a);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);animation:blobFloat 4s ease-in-out infinite;filter:blur(1px);opacity:.85;transition:all .5s ease}
#blob.active{animation:blobActive 1.5s ease-in-out infinite;filter:blur(0);opacity:1}
#blob.notify{animation:ring 1.5s ease-out 3}
#state-text{margin-top:20px;font-family:'Cabinet Grotesk',sans-serif;font-size:16px;color:var(--text-secondary);text-align:center;transition:font-size .3s;cursor:pointer}
#state-sub{font-size:13px;color:var(--text-muted);margin-top:6px;text-align:center}
#quick-actions{display:flex;gap:10px;margin-top:20px;transition:opacity .3s}
#quick-actions button{background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;color:var(--text-secondary);padding:8px 16px;font-size:13px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .15s}
#quick-actions button:hover{background:var(--bg-surface);color:var(--text-primary)}
#pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 16px;min-height:30px}
.pill{background:var(--bg-elevated);border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:12px;color:var(--text-muted);font-family:'Recursive',monospace;animation:fadeUp .3s ease}
.pill.active{border-color:var(--accent-rose);color:var(--accent-rose)}
.pill.done{border-color:#6bc46b;color:#6bc46b}
#chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;opacity:0;transition:opacity .4s ease}
#chat-area.visible{opacity:1}
#chat-msgs{flex:1;overflow-y:auto;padding:12px 20px;max-width:700px;margin:0 auto;width:100%}
#chat-msgs::-webkit-scrollbar{width:5px}
#chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg{margin-bottom:12px;animation:fadeUp .3s ease}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--bg-elevated);border:1px solid var(--border);padding:8px 14px;border-radius:14px 14px 2px 14px;max-width:70%;font-size:14px}
.msg.assistant .name{color:var(--accent-rose);font-weight:600;font-size:12px;margin-bottom:3px;font-family:'Cabinet Grotesk',sans-serif}
.msg.assistant .body{color:var(--text-secondary);line-height:1.6;font-size:14px}
.msg.system{text-align:center;font-size:12px;color:var(--text-muted)}
#input-area{border-top:1px solid var(--border);padding:10px 16px;max-width:700px;margin:0 auto;width:100%;display:flex;gap:8px;align-items:flex-end}
#input-area textarea{flex:1;background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;padding:10px 14px;resize:none;outline:none;min-height:40px;max-height:100px}
#input-area textarea:focus{border-color:var(--accent-rose)}
#input-area button{background:var(--accent-rose);border:none;border-radius:10px;color:var(--bg-deep);font-weight:600;padding:10px 16px;cursor:pointer;font-size:14px}
</style></head><body>
<div id="app">
<div id="presence">
<div id="blob-wrap"><div id="blob"></div></div>
<div id="state-text">Idle — last active 3 min ago</div>
<div id="state-sub"></div>
<div id="quick-actions">
<button onclick="quickAction('happening')">What's happening?</button>
<button onclick="quickAction('catchup')">Catch me up</button>
<button onclick="quickAction('task')">Start a task</button>
</div>
</div>
<div id="pills"></div>
<div id="chat-area">
<div id="chat-msgs"></div>
<div id="input-area"><textarea id="inp" rows="1" placeholder="Message Mikki..."></textarea><button id="send">Send</button></div>
</div>
</div>
<script>
const presence=document.getElementById('presence'),blob=document.getElementById('blob'),stateText=document.getElementById('state-text'),stateSub=document.getElementById('state-sub'),pillsEl=document.getElementById('pills'),chatArea=document.getElementById('chat-area'),chatMsgs=document.getElementById('chat-msgs'),inp=document.getElementById('inp');
let demoStep=0,demoLock=false,chatOpen=false;

function openChat(){if(chatOpen)return;chatOpen=true;presence.classList.add('compact');chatArea.classList.add('visible')}
function closeChat(){chatOpen=false;presence.classList.remove('compact');chatArea.classList.remove('visible')}
function scroll(){chatMsgs.scrollTop=chatMsgs.scrollHeight}

function setState(text,sub,active){stateText.textContent=text;stateSub.textContent=sub||'';if(active){blob.classList.add('active');blob.classList.remove('notify')}else{blob.classList.remove('active')}}

function addPill(id,text,cls){const d=document.createElement('div');d.className='pill '+(cls||'');d.id='pill-'+id;d.textContent=text;pillsEl.appendChild(d)}
function updatePill(id,text,cls){const d=document.getElementById('pill-'+id);if(d){d.textContent=text;d.className='pill '+(cls||'')}}
function removePills(){pillsEl.innerHTML=''}

function addUser(text){openChat();const d=document.createElement('div');d.className='msg user';d.innerHTML=`<div class="bubble">${text}</div>`;chatMsgs.appendChild(d);scroll()}
function streamAssistant(text,cb){openChat();const d=document.createElement('div');d.className='msg assistant';d.innerHTML=`<div class="name">Mikki</div><div class="body"></div>`;chatMsgs.appendChild(d);const body=d.querySelector('.body');let i=0;const iv=setInterval(()=>{if(i<text.length){body.textContent+=text[i];i++;scroll()}else{clearInterval(iv);cb&&cb()}},25)}
function addSystem(text){const d=document.createElement('div');d.className='msg system';d.textContent=text;chatMsgs.appendChild(d);scroll()}

function quickAction(type){
  if(type==='catchup'||type==='happening'){openChat();inp.value='what\'s the status on everything?';handleSend()}
  else{openChat();inp.focus()}
}

function spawnForge(){
  setState('Working — Forge fixing image upload','1 agent active',true);
  addPill('forge','🔨 Forge: fixing PR... 0s','active');
  let sec=0;const ti=setInterval(()=>{sec++;updatePill('forge','🔨 Forge: fixing PR... '+sec+'s','active')},1000);
  const steps=['Reading files...','Fixing send button gating...','Fixing TypeScript error...','Running type check...','Committing changes...'];
  let si=0;
  const iv=setInterval(()=>{
    if(si<steps.length){stateSub.textContent=steps[si];si++}
    else{clearInterval(iv);clearInterval(ti);
      updatePill('forge','✓ Forge: complete','done');
      setState('Idle','All tasks complete',false);
      streamAssistant('Done. Fixed send button gating and TS compilation error. Ready for review.',()=>{
        setTimeout(()=>{addSystem('🔔 Bastion\'s daily audit complete. 1 finding: 17 pending system updates.');demoLock=false},2000);
      });
    }
  },1500);
}

function handleSend(){
  const t=inp.value.trim();if(!t)return;inp.value='';
  addUser(t);
  if(demoStep===0&&/status|everything|happening/i.test(t)){demoStep=1;demoLock=true;
    setTimeout(()=>streamAssistant('PIN auth shipped ✅. Room prototype waiting on Alma\'s fixes. Image upload PR pending — has a gating bug. Chaos testing running.',()=>{demoLock=false}),400);
  }else if(demoStep===1&&/fix.*image|image.*fix/i.test(t)){demoStep=2;demoLock=true;
    setTimeout(()=>streamAssistant('On it. Spawning Forge...',()=>{setTimeout(spawnForge,500)}),400);
  }else if(!demoLock){setTimeout(()=>streamAssistant('(Demo mode — try "what\'s the status on everything?" or "fix the image upload PR")'),300)}
}

document.getElementById('send').onclick=handleSend;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});
inp.addEventListener('focus',openChat);

// Auto-play
setTimeout(()=>{
  blob.classList.add('notify');
  stateText.textContent='3 things happened while you were away';stateText.style.cursor='pointer';
  stateSub.textContent='Tap to expand';
  setTimeout(()=>{
    openChat();
    const aw=document.createElement('div');aw.className='msg system';aw.innerHTML='While you were away: Bastion\'s audit passed ✓, Forge finished PIN auth (PR #7 merged), 2 new emails arrived.';chatMsgs.appendChild(aw);
    setTimeout(()=>{
      addUser('what\'s the status on everything?');demoLock=true;
      setTimeout(()=>{demoStep=1;streamAssistant('PIN auth shipped ✅. Room prototype waiting on Alma\'s fixes. Image upload PR pending — has a gating bug. Chaos testing running.',()=>{demoLock=false;
        setTimeout(()=>{addUser('fix the image upload PR');demoStep=2;demoLock=true;
          setTimeout(()=>streamAssistant('On it. Spawning Forge...',()=>{setTimeout(spawnForge,500)}),400);
        },2000);
      })},600);
    },1500);
  },2500);
},2000);

stateText.onclick=()=>{if(!chatOpen)openChat()};
</script></body></html>
