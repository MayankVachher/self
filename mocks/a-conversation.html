<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lume — Conversation</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Recursive:wght,CASL,MONO@400,0.5,1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-deep:#1a1410;--bg-surface:#231e18;--bg-elevated:#2e2720;--text-primary:#f5f0e8;--text-secondary:#c4b8a8;--text-muted:#9a8e80;--accent-rose:#c4867a;--accent-gold:#c4a24e;--border:#3a322a}
html,body{height:100%;background:var(--bg-deep);color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px}
#app{display:flex;flex-direction:column;height:100vh}
#messages{flex:1;overflow-y:auto;padding:24px 16px 16px}
#messages::-webkit-scrollbar{width:6px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.col{max-width:800px;margin:0 auto;width:100%}
.msg{margin-bottom:16px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--bg-elevated);border:1px solid var(--border);padding:10px 16px;border-radius:16px 16px 4px 16px;max-width:70%;line-height:1.5}
.msg.assistant .name{color:var(--accent-rose);font-weight:600;font-size:13px;margin-bottom:4px;font-family:'Cabinet Grotesk',sans-serif}
.msg.assistant .body{line-height:1.6;color:var(--text-secondary)}
.msg.system{text-align:center;color:var(--text-muted);font-size:13px;padding:8px 0}
.away-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px}
.away-card h3{font-family:'Cabinet Grotesk',sans-serif;font-size:14px;color:var(--accent-gold);margin-bottom:10px}
.away-card ul{list-style:none;color:var(--text-secondary);font-size:14px;line-height:1.8}
.away-card li::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:10px;vertical-align:middle}
.away-card li:nth-child(1)::before{background:#6bc46b}
.away-card li:nth-child(2)::before{background:#6bc46b}
.away-card li:nth-child(3)::before{background:var(--accent-gold)}
.work-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:8px 0;overflow:hidden}
.work-card .wc-header{display:flex;align-items:center;gap:8px;cursor:pointer}
.work-card .wc-icon{width:24px;height:24px;border-radius:6px;background:var(--accent-rose);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.work-card .wc-title{font-family:'Cabinet Grotesk',sans-serif;font-weight:600;font-size:14px;flex:1}
.work-card .wc-status{font-size:12px;color:var(--text-muted);font-family:'Recursive',monospace}
.work-card .wc-log{margin-top:10px;font-family:'Recursive',monospace;font-size:12px;color:var(--text-muted);line-height:1.8}
.work-card .wc-log div{animation:fadeUp .2s ease}
.work-card.done{border-color:rgba(107,196,107,.3)}
.work-card.done .wc-icon{background:#6bc46b}
.work-card.active .wc-icon{animation:pulse 1.5s infinite}
#input-area{border-top:1px solid var(--border);background:var(--bg-surface);padding:12px 16px}
#input-area .col{display:flex;gap:10px;align-items:flex-end}
#input-area textarea{flex:1;background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;padding:10px 14px;resize:none;outline:none;min-height:42px;max-height:120px;line-height:1.4}
#input-area textarea:focus{border-color:var(--accent-rose)}
#input-area button{background:var(--accent-rose);border:none;border-radius:10px;color:var(--bg-deep);font-weight:600;padding:10px 18px;cursor:pointer;font-size:14px;white-space:nowrap}
#input-area button:hover{opacity:.85}
</style></head><body>
<div id="app">
<div id="messages"><div class="col" id="msg-col"></div></div>
<div id="input-area"><div class="col"><textarea id="inp" rows="1" placeholder="Message Mikki..."></textarea><button id="send">Send</button></div></div>
</div>
<script>
const col=document.getElementById('msg-col'),inp=document.getElementById('inp'),sendBtn=document.getElementById('send'),msgs=document.getElementById('messages');
let demoStep=0, demoLock=false;

function scroll(){msgs.scrollTop=msgs.scrollHeight}
function addUser(text){const d=document.createElement('div');d.className='msg user';d.innerHTML=`<div class="bubble">${esc(text)}</div>`;col.appendChild(d);scroll()}
function addSystem(text){const d=document.createElement('div');d.className='msg system';d.textContent=text;col.appendChild(d);scroll()}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function streamAssistant(text,cb){
  const d=document.createElement('div');d.className='msg assistant';
  d.innerHTML=`<div class="name">Mikki</div><div class="body"></div>`;
  col.appendChild(d);const body=d.querySelector('.body');
  let i=0;const iv=setInterval(()=>{if(i<text.length){body.textContent+=text[i];i++;scroll()}else{clearInterval(iv);if(cb)cb()}},25);
  return d;
}

function addAwayCard(){
  const d=document.createElement('div');d.className='away-card';d.style.animation='fadeUp .4s ease';
  d.innerHTML=`<h3>While you were away</h3><ul><li>Bastion's daily security audit passed ✓</li><li>Forge finished PIN auth fixes (PR #7 merged)</li><li>2 new emails arrived</li></ul>`;
  col.appendChild(d);scroll();
}

function addWorkCard(){
  const d=document.createElement('div');d.className='work-card active';
  d.innerHTML=`<div class="wc-header"><div class="wc-icon">⚒</div><div class="wc-title">Forge — fixing image upload PR</div><div class="wc-status">working...</div></div><div class="wc-log"></div>`;
  col.appendChild(d);scroll();
  const log=d.querySelector('.wc-log'),status=d.querySelector('.wc-status');
  const steps=['Reading files...','Fixing send button gating...','Fixing TypeScript error...','Running type check...','Committing changes...'];
  let si=0;
  const iv=setInterval(()=>{
    if(si<steps.length){const l=document.createElement('div');l.textContent='> '+steps[si];log.appendChild(l);status.textContent=steps[si];si++;scroll()}
    else{clearInterval(iv);d.classList.remove('active');d.classList.add('done');status.textContent='complete';
      const l=document.createElement('div');l.style.color='#6bc46b';l.textContent='✓ Done. Fixed send button gating and TS compilation error. Ready for review.';log.appendChild(l);scroll();
      setTimeout(()=>{addSystem('🔔 Bastion\'s daily audit complete. 1 finding: 17 pending system updates.');demoLock=false},2000);
    }
  },1500);
}

function handleSend(){
  const t=inp.value.trim();if(!t)return;inp.value='';inp.style.height='auto';
  addUser(t);
  if(demoStep===0&&/status|everything/i.test(t)){demoStep=1;demoLock=true;
    setTimeout(()=>streamAssistant('Here\'s where everything stands:\n\n• PIN Auth — shipped ✅ PR #7 merged\n• Room prototype — waiting on Alma\'s layout fixes\n• Image upload PR — pending review, has a send-button gating bug\n• Chaos testing — running, Forge has it',()=>{demoLock=false}),600);
  } else if(demoStep===1&&/fix.*image|image.*fix/i.test(t)){demoStep=2;demoLock=true;
    setTimeout(()=>streamAssistant('On it. Spawning Forge to fix the image upload PR...',()=>{setTimeout(addWorkCard,500)}),600);
  } else if(!demoLock){
    setTimeout(()=>streamAssistant('(Demo mode — try "what\'s the status on everything?" or "fix the image upload PR")'),400);
  }
}

sendBtn.onclick=handleSend;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});

// Auto-play demo
setTimeout(()=>{
  addAwayCard();
  setTimeout(()=>{addUser('what\'s the status on everything?');demoStep=0;
    setTimeout(()=>{demoLock=true;demoStep=1;
      streamAssistant('Here\'s where everything stands:\n\n• PIN Auth — shipped ✅ PR #7 merged\n• Room prototype — waiting on Alma\'s layout fixes\n• Image upload PR — pending review, has a send-button gating bug\n• Chaos testing — running, Forge has it',()=>{
        demoLock=false;
        setTimeout(()=>{addUser('fix the image upload PR');demoStep=2;demoLock=true;
          setTimeout(()=>streamAssistant('On it. Spawning Forge to fix the image upload PR...',()=>{setTimeout(addWorkCard,500)}),600);
        },2000);
      });
    },600);
  },1500);
},2000);
</script></body></html>
